board:
  name: rp2350_zero_core2021
  full_name: Waveshare RP2350-Zero + Core2021
  vendor: zlrs
  socs:
    - name: rp2350a
      variants:
        # Sub-G hardware comes in two SKUs: HF (850-930 MHz, runs 868/915)
        # and LF (410-510 MHz, runs 470/433). The 2.4G path is identical on both.
        - name: hf
          cpucluster: m33
          variants:
            # MCUboot builds: partitions and the upgrade flow are in the README
            - name: mcuboot
              cpucluster: m33
        - name: lf
          cpucluster: m33
          variants:
            - name: mcuboot
              cpucluster: m33
