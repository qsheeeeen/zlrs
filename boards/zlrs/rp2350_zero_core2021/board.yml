board:
  name: rp2350_zero_core2021
  full_name: Waveshare RP2350-Zero + Core2021
  vendor: zlrs
  socs:
    - name: rp2350a
      variants:
        # sub-G 硬件是两个 SKU：HF（850–930 MHz，跑 868/915）
        # 与 LF（410–510 MHz，跑 470/433）。2.4G 那一路两者相同。
        - name: hf
          cpucluster: m33
          variants:
            # 带 MCUboot 的构建：分区与升级流程见 README
            - name: mcuboot
              cpucluster: m33
        - name: lf
          cpucluster: m33
          variants:
            - name: mcuboot
              cpucluster: m33
