#
# RAC layer on top of usp_zephyr (no LoRaWAN here, so CONFIG_USP_LORA_BASICS_MODEM
# stays off). Settings follow the vendor sample
# samples/usp/sdk/packet_error_rate_flrc/prj.conf.

# ------------------------------ General ---------------------------------------
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_LOG=y
CONFIG_PM_DEVICE=y
# The watchdog subsystem must be built in for ZLRS_APP_WATCHDOG to arm it (off by default)
CONFIG_WATCHDOG=y
CONFIG_FLASH=y

# Application side: interrupt-driven UARTs, NVS for keys and pairing, the button
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_NVS=y
CONFIG_FLASH_MAP=y
CONFIG_GPIO=y

# RP2350 hardware TRNG uses the zlrs driver (drivers/trng); Zephyr's own goes through
# pico-sdk's interrupt-off busy wait and kills USB. Enable ZLRS_APP_ENTROPY_TRNG to use it.
CONFIG_ENTROPY_RPI_PICO_RNG=n

# The entropy source initialises after the hardware watchdog (PRE_KERNEL_1 + 51): its probe
# touches TRNG registers, and if that hangs the CPU the watchdog can still reset the board.
# The first consumer is mbedTLS at POST_KERNEL, so anything before that is early enough.
CONFIG_ENTROPY_INIT_PRIORITY=60

# Three CDCs: CRSF, data, console. lib/usb builds its own usbd context, so Zephyr's
# register-only-the-first-CDC helper stays off.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_UART_LINE_CTRL=y

# One buffer pool per CDC. By default a full-speed device shares the UDC's 1 KB pool, and
# a failed RX allocation wedges the driver forever (busy bit never clears): TX works, RX silently dies.
CONFIG_USBD_CDC_ACM_BUF_POOL=y

# The superframe runs around 150 Hz: 1 ms tick granularity, roughly 7 ms per frame
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000


# ------------------------------ radio stack -----------------------------------
CONFIG_LORA_BASICS_MODEM_DRIVERS=y
CONFIG_LORA_BASICS_MODEM_DRIVERS_EVENT_TRIGGER_GLOBAL_THREAD=y

CONFIG_USP=y
CONFIG_USP_MAIN_THREAD=y

# ------------------------------ threading model -------------------------------
# Cooperative (negative priorities), same as the vendor RAC sample, see doc/07-architecture.md 6
CONFIG_MAIN_THREAD_PRIORITY=-2
CONFIG_USP_MAIN_THREAD_PRIORITY=-4
CONFIG_USP_THREADS_MUTEXES=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_THREAD_NAME=y

# ------------------------------ zlrs ------------------------------------------
# Library switches are not listed here: ZLRS_APP_CORE in app/Kconfig enables the always-needed
# ones, the rest (config protocol, status LED) follow their feature switches (08-firmware 4).
#
# The USB device stack (lib/usb) belongs in the application image: it builds the usbd context
# and registers every CDC; the bootloader's copy is enabled in sysbuild/mcuboot.conf.
CONFIG_ZLRS_USB=y

# Status LED: the on-board WS2812 runs on PIO (the driver follows devicetree)
CONFIG_LED_STRIP=y
