# 基于 usp_zephyr 的 RAC 层（不做 LoRaWAN，所以不打开
# CONFIG_USP_LORA_BASICS_MODEM）。配置项对齐官方 RAC 示例
# samples/usp/sdk/packet_error_rate_flrc/prj.conf。

# ------------------------------ General ---------------------------------------
CONFIG_USE_SEGGER_RTT=n
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_PM_DEVICE=y
CONFIG_WATCHDOG=n
CONFIG_FLASH=y

# 应用侧：串口中断收发、NVS 存密钥与配对记录、按键
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_NVS=y
CONFIG_FLASH_MAP=y
CONFIG_GPIO=y

# 超帧按 150 Hz 走，1 ms 的 tick 粒度下每帧约 7 ms（量化误差待上板实测）
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# 用 Zephyr SDK 自带的 newlib，跟 Semtech 官方示例一致。
# （换回发行版 arm-none-eabi-gcc 就会撞 "Retargetable locking must be
# enabled"——那份 newlib 没开 retargetable locking，所以工具链别混用。）
CONFIG_NEWLIB_LIBC=y

# 密码学原语走 Zephyr 自带的 mbedTLS，见 lib/proto/crypto.h：
# SHA-256 与 MD 是基础，HKDF 用于密钥派生，PKCS5 提供 PBKDF2。
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_SHA256=y
CONFIG_MBEDTLS_MD=y
CONFIG_MBEDTLS_HKDF_C=y
CONFIG_MBEDTLS_PKCS5_C=y

# ------------------------------ 射频栈 ----------------------------------------
CONFIG_LORA_BASICS_MODEM_DRIVERS=y
CONFIG_LORA_BASICS_MODEM_DRIVERS_EVENT_TRIGGER_GLOBAL_THREAD=y

CONFIG_USP=y
CONFIG_USP_MAIN_THREAD=y

# ------------------------------ 线程模型 --------------------------------------
# 协作式（负优先级），与官方 RAC 示例一致：
#   RAC 线程 -4，应用 main 线程 -2，切换只发生在让出点，API 调用是直调。
# 选型理由与切换到抢占式+互斥锁时的注意点见 docs/threading.md。
CONFIG_MAIN_THREAD_PRIORITY=-2
CONFIG_USP_MAIN_THREAD_PRIORITY=-4
CONFIG_USP_THREADS_MUTEXES=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_THREAD_NAME=y

# ------------------------------ 本地协议核心 ----------------------------------
CONFIG_ZLRS_PROTO=y
CONFIG_ZLRS_LINK=y
