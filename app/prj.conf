# 基于 usp_zephyr 的 RAC 层（不做 LoRaWAN，所以不打开
# CONFIG_USP_LORA_BASICS_MODEM）。配置项对齐官方 RAC 示例
# samples/usp/sdk/packet_error_rate_flrc/prj.conf。

# ------------------------------ General ---------------------------------------
CONFIG_USE_SEGGER_RTT=n
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_PM_DEVICE=y
# 看门狗子系统要编进来，ZLRS_APP_WATCHDOG 才有得装（默认关）
CONFIG_WATCHDOG=y
CONFIG_FLASH=y

# 应用侧：串口中断收发、NVS 存密钥与配对记录、按键
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_NVS=y
CONFIG_FLASH_MAP=y
CONFIG_GPIO=y

# RP2350 硬件 TRNG 暂时关掉（ZLRS_APP_ENTROPY_TRNG 打开才用）：那个驱动会让
# USB 死掉，原因见 app/Kconfig 与 doc/13-roadmap.md
CONFIG_ENTROPY_RPI_PICO_RNG=n

# USB 三块 CDC：CRSF、数据口、控制台。usbd context 由 lib/usb 自己建，所以关掉
# Zephyr 那个"只注册第一块 CDC"的辅助开关
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_UART_LINE_CTRL=y

# 每块 CDC 用自己的缓冲池。默认（全速设备）共用 UDC 的 1 KB 公共池，RX 工作项
# 分配失败后会在驱动里永久卡住（busy 位不清），表现为"只能发不能收且无提示"。
CONFIG_USBD_CDC_ACM_BUF_POOL=y

# 超帧按 150 Hz 走：1 ms 的 tick 粒度，每帧约 7 ms
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000


# ------------------------------ 射频栈 ----------------------------------------
CONFIG_LORA_BASICS_MODEM_DRIVERS=y
CONFIG_LORA_BASICS_MODEM_DRIVERS_EVENT_TRIGGER_GLOBAL_THREAD=y

CONFIG_USP=y
CONFIG_USP_MAIN_THREAD=y

# ------------------------------ 线程模型 --------------------------------------
# 协作式（负优先级），与官方 RAC 示例一致，见 doc/07-architecture.md 第 6 节
CONFIG_MAIN_THREAD_PRIORITY=-2
CONFIG_USP_MAIN_THREAD_PRIORITY=-4
CONFIG_USP_THREADS_MUTEXES=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_THREAD_NAME=y

# ------------------------------ 本地协议核心 ----------------------------------
CONFIG_ZLRS_PROTO=y
CONFIG_ZLRS_LINK=y
CONFIG_ZLRS_CRSF=y
CONFIG_ZLRS_CONFIG=y
CONFIG_ZLRS_REGION=y
CONFIG_ZLRS_LED=y

# 状态灯：板载 WS2812 走 PIO（驱动按 devicetree 自动打开）
CONFIG_LED_STRIP=y
