# 基于 usp_zephyr 的 RAC 层（不做 LoRaWAN，所以不打开
# CONFIG_USP_LORA_BASICS_MODEM）。配置项对齐官方 RAC 示例
# samples/usp/sdk/packet_error_rate_flrc/prj.conf。

# ------------------------------ General ---------------------------------------
CONFIG_USE_SEGGER_RTT=n
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_PM_DEVICE=y
# 看门狗子系统要编进来，ZLRS_APP_WATCHDOG 才有得装（默认关着，
# 见 app/Kconfig：它是"崩了自动复位"的助力，回滚本身靠 MCUboot 的确认位）
CONFIG_WATCHDOG=y
CONFIG_FLASH=y

# 应用侧：串口中断收发、NVS 存密钥与配对记录、按键
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_NVS=y
CONFIG_FLASH_MAP=y
CONFIG_GPIO=y

# RP2350 的硬件 TRNG 暂时关掉（ZLRS_APP_ENTROPY_TRNG 打开才用）。
# 为什么：那个驱动会让 USB 死掉——pico-sdk 的 TRNG 采样是"自旋锁 + 关中断 +
# 忙等 trng_busy"，USB 在这期间得不到服务（上板现象：应用在跑、灯在闪，主机侧
# "设备描述符请求失败"）。见 app/Kconfig 与 doc/05-roadmap.md 的 M0/M1。
CONFIG_ENTROPY_RPI_PICO_RNG=n

# USB 上三块 CDC：CRSF、数据口、控制台（控制台由板级 chosen 的
# zephyr,console 指定）。设备栈与 CDC ACM 类都开着，但 usbd context 由应用自己
# 建（app/src/usb_dev.c，配置项见 ZLRS_APP_USB_*）——所以这里必须关掉 Zephyr
# 那个只注册第一块 CDC 的辅助开关，否则后两块 CDC 没有 context，第一次写日志
# 就是 NULL 解引用。
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_UART_LINE_CTRL=y

# 三块 CDC 各自用自己的缓冲池。为什么不能省：全速设备上
# CONFIG_USBD_CDC_ACM_BUF_POOL 默认是关的，三块 CDC 就都去抢 UDC 那个
# UDC_BUF_POOL_SIZE=1024 的公共池；枚举刚完成时池子还被控制传输与
# 控制台 TX 占着，CDC 的 RX 工作项一旦分配失败就在 rx_fifo_work 里直接
# return，而 CDC_ACM_RX_FIFO_BUSY 位不会清——之后永不重试，接收端从此装死
# （TX 照常，因为 TX 按需分配）。CDC 驱动自己的日志又因为"控制台挂在 CDC 上"
# 被编译期强制成 NONE，现象就是"串口只能收不能发，且毫无提示"。
CONFIG_USBD_CDC_ACM_BUF_POOL=y

# 超帧按 150 Hz 走：1 ms 的 tick 粒度，每帧约 7 ms
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000


# ------------------------------ 射频栈 ----------------------------------------
CONFIG_LORA_BASICS_MODEM_DRIVERS=y
CONFIG_LORA_BASICS_MODEM_DRIVERS_EVENT_TRIGGER_GLOBAL_THREAD=y

CONFIG_USP=y
CONFIG_USP_MAIN_THREAD=y

# ------------------------------ 线程模型 --------------------------------------
# 协作式（负优先级），与官方 RAC 示例一致：
#   RAC 线程 -4，应用 main 线程 -2，切换只发生在让出点，API 调用是直调。
# 选型理由与切换到抢占式+互斥锁时的注意点见 doc/01-system.md 第 7 节。
CONFIG_MAIN_THREAD_PRIORITY=-2
CONFIG_USP_MAIN_THREAD_PRIORITY=-4
CONFIG_USP_THREADS_MUTEXES=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_THREAD_NAME=y

# ------------------------------ 本地协议核心 ----------------------------------
CONFIG_ZLRS_PROTO=y
CONFIG_ZLRS_LINK=y
CONFIG_ZLRS_CRSF=y
CONFIG_ZLRS_CONFIG=y
CONFIG_ZLRS_REGION=y
CONFIG_ZLRS_LED=y

# 状态灯：板载 WS2812 走 PIO（驱动按 devicetree 自动打开）
CONFIG_LED_STRIP=y
