# USP supplies the LR20xx RAL driver and Zephyr HAL. The application owns the radio;
# RAC/planner and the USP main thread are not started. No LoRaWAN stack is enabled.

# ------------------------------ General ---------------------------------------
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_LOG=y
CONFIG_PM_DEVICE=y
# Hardware watchdog, armed in every image (app/src/platform/watchdog.c): a hang becomes a reset,
# and on an image the host has not confirmed yet that reset is MCUboot's rollback.
# CONFIG_WATCHDOG is the Zephyr subsystem, ZLRS_APP_WATCHDOG is what arms it.
CONFIG_WATCHDOG=y
CONFIG_ZLRS_APP_WATCHDOG=y
CONFIG_FLASH=y
CONFIG_COUNTER=y
# On-demand MCU die temperature in status.
CONFIG_SENSOR=y

# Short LR2021 SPI commands use polling to avoid per-transfer DMA setup and
# completion wakeups in the fixed preparation window. The one-pixel PIO LED
# also writes directly to its FIFO; neither path needs the DMA driver.
CONFIG_DMA=n
CONFIG_SPI_PL022_DMA=n

# Zephyr selects the SHA-256 driver from the enabled devicetree peripheral.
CONFIG_CRYPTO=y

# Application side: NVS for keys and pairing, and the flash map the partitions describe
# (the UARTs, GPIO and the USB stack come from the board, shared with the bootloader)
CONFIG_NVS=y
CONFIG_FLASH_MAP=y

# The entropy source initialises after the hardware watchdog (PRE_KERNEL_1 + 51): its probe
# touches TRNG registers, and if that hangs the CPU the watchdog can still reset the board.
# Zephyr's cryptographic random API reads this device directly; no PSA provider is needed.
CONFIG_ENTROPY_INIT_PRIORITY=60
CONFIG_CSPRNG_NEEDED=y

# Two CDCs: data and management. The stack itself and the CDC class come from the board
# (boards/…/Kconfig.defconfig, shared with the MCUboot image); subsys/usb builds its own usbd
# context, so Zephyr's register-only-the-first-CDC helper stays off.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# One buffer pool per CDC. By default a full-speed device shares the UDC's 1 KB pool, and
# a failed RX allocation wedges the driver forever (busy bit never clears): TX works, RX silently dies.
CONFIG_USBD_CDC_ACM_BUF_POOL=y
# INFO dumps every received payload and logs FIFO wakeups. Keep normal CDC traffic
# out of the deferred log queue and log export's rotating files.
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y

# The application takes part in the upgrade: it confirms the image the host approved, checks the
# confirm bit at boot and lets MCUboot roll back a build that never came up (doc/06-firmware.md).
# The bootloader's side of the same machinery is in app/sysbuild/mcuboot.conf.
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y

# Kernel timeouts use 1 ms ticks; TIMER1 schedules RF independently at microsecond resolution.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000


# ------------------------------ radio stack -----------------------------------
CONFIG_LORA_BASICS_MODEM_DRIVERS=y
CONFIG_LORA_BASICS_MODEM_DRIVERS_EVENT_TRIGGER_NO_THREAD=y
# The vendor default is 600000 (ten minutes): a radio that never raises BUSY would spin on the
# main thread for that long, starving the watchdog feed. One second covers the radio's own
# wake-up and calibration. The unmodified upstream HAL raises k_oops on timeout;
# the watchdog resets the board if radio access cannot recover.
CONFIG_LORA_BASICS_MODEM_DRIVERS_HAL_WAIT_ON_BUSY_TIMEOUT_MSEC=1000

CONFIG_USP=y
CONFIG_USP_MAIN_THREAD=n
# Keep unused USP layers quiet; radio diagnostics come from the application port.
CONFIG_USP_LOG_LEVEL_WRN=y

# ------------------------------ threading model -------------------------------
# Main owns the data link and radio preparation/completion (doc/05-architecture.md).
# The RF owner raises its runtime priority after initialization; management uses this priority.
CONFIG_MAIN_THREAD_PRIORITY=-2
# The RF owner can preempt cooperative USB workers while servicing hardware events.
CONFIG_NUM_METAIRQ_PRIORITIES=1
# TIMER1 alarm 3 issues the prepared SET_TX command independently of kernel IRQ locks.
CONFIG_ZERO_LATENCY_IRQS=y
# Keep upstream CDC worker scheduling; integration stays inside ZLRS.

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_THREAD_NAME=y

# ------------------------------ zlrs ------------------------------------------
# Library switches are not listed here: ZLRS_APP_CORE in app/Kconfig enables the always-needed
# ones, the rest (management protocol, status LED) follow their feature switches (doc/06-firmware.md).
#
# The USB device stack (subsys/usb) belongs in the application image: it builds the usbd context
# and registers every CDC; the bootloader's copy is enabled in sysbuild/mcuboot.conf.
CONFIG_ZLRS_USB=y
# The callback only updates atomic host facts. Avoid deferred notification loss
# or stale selection behind CDC line-control messages on the system workqueue.
CONFIG_USBD_MSG_DEFERRED_MODE=n

# Status LED: the strip API is part of every image and devicetree picks the driver behind it —
# the on-board WS2812 here runs on PIO. A board without a `zlrs-led` alias has no device and the
# LED thread simply has nothing to show (app/src/ui.c).
CONFIG_LED_STRIP=y
# The LED is its own thread and the system state rides zbus: producers publish what the device is
# doing (RF link/alerts and management mode), and the LED thread decides how to show it
# (app/src/ui.c, doc/09-ux.md). ZBUS is the only bus in the image, and it is what keeps
# the strip write out of the superframe.
CONFIG_ZBUS=y

# ------------------------------ diagnostics -----------------------------------
# The log is kept in flash as well as printed: Zephyr's file-logging backend writes the same
# stream to a power-fail-safe LittleFS on log_partition, rotating files so the oldest are
# overwritten (that is the ring), and the console keeps working as before (doc/06-firmware.md).
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FLASH_PAGE_LAYOUT=y
# Read flash around the XIP cache, or a read after a write can return the line cached before it
# (LittleFS then mounts "corrupted", NVS silently reverts). Set by the board for both images.
CONFIG_LOG_BACKEND_FS=y
CONFIG_LOG_BACKEND_FS_DIR="/lfs"
CONFIG_LOG_BACKEND_FS_FILE_PREFIX="log."
# The ring is FILE_SIZE × FILES_LIMIT = 1 MB, which has to be the log_partition in
# boards/…/rp2350_zero_core2021_partitions.dtsi; CI checks the arithmetic.
CONFIG_LOG_BACKEND_FS_FILE_SIZE=131072
CONFIG_LOG_BACKEND_FS_FILES_LIMIT=8
CONFIG_LOG_BACKEND_FS_OVERWRITE=y
CONFIG_LOG_BACKEND_FS_APPEND_TO_NEWEST_FILE=y
# Flash writes mask RP2350 IRQs. Queue logs in RAM during RF operation and drain only at boot
# or in management mode, where radio work is paused. Overflow retains the newest messages.
CONFIG_LOG_PROCESS_THREAD=n
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_MODE_OVERFLOW=y
# Backends initialize at boot; messages are processed only after the application starts,
# by which time app/src/log.c has mounted the file system (POST_KERNEL 100).
CONFIG_LOG_CORE_INIT_PRIORITY=90

# A fatal error leaves its registers and stacks in coredump_partition; decode it offline with
# scripts/coredump (doc/10-debug.md). It is not written from the faulting context itself.
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_FLASH_PARTITION=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_THREADS=y

# Reset cause for the boot record in the log (hwinfo_rpi_pico)
CONFIG_HWINFO=y
