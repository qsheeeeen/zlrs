# 调试用（不随正常构建）：把 bootloader 的串口恢复窗口从 2 s 拉到 15 s，
# 并把 bootloader 的日志打开。应用没起来时，每次复位后都能有足够时间连上
# 恢复口看日志、刷镜像——不用按 BOOTSEL。
#
#   west build --sysbuild -b "$ZLRS_BOARD/mcuboot" "$ZLRS_APP" -- \
#     -Dmcuboot_EXTRA_CONF_FILE="$ZLRS_REPO_ROOT/app/sysbuild/mcuboot-debug.conf"

CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=15000
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
