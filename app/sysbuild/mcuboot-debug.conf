#
# Debug only (never in a normal build): stretch the serial recovery window from 2 s to 15 s and
# turn on the bootloader log. When the application does not come up, every reset leaves enough
# time to attach, read the log and reflash, without touching BOOTSEL.
#
#   west build --sysbuild -b "$ZLRS_BOARD" "$ZLRS_APP" -- \
#     -Dmcuboot_EXTRA_CONF_FILE="$ZLRS_REPO_ROOT/app/sysbuild/mcuboot-debug.conf"

CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=15000
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
