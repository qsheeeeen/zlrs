# 只作用于 MCUboot 镜像的配置（sysbuild 会把换槽模式自动同步过去，这里不重复设）。

# 串口恢复：bootloader 自己收 mcumgr 帧写进 slot。走 USB CDC（`zephyr,uart-mcumgr`
# 指向数据口那块），插板载 USB-C 就能升级。
#
# 用 BOOT_SERIAL_UART 而不是 BOOT_SERIAL_CDC_ACM：后者要旧 USB 栈，还要求全树
# 只有一个 `zephyr,cdc-acm-uart` 节点，而本板有三块 CDC。UART 这条路的设备同样
# 可以是 CDC 的 UART 接口。
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y

# bootloader 的控制台在 cdc_acm_uart3（板级默认关闭，overlay 打开）
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# USB 设备栈与应用共用 lib/usb；Zephyr 的辅助开关只注册第一块 CDC，不能用
CONFIG_ZLRS_USB=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# bootloader 模式在 USB 上怎么自我介绍：升级脚本靠这个名字找恢复口
# （应用模式是 "ZLRS"，默认值见 lib/usb/Kconfig）。
CONFIG_ZLRS_USB_MANUFACTURER="zlrs"
CONFIG_ZLRS_USB_PRODUCT="ZLRS MCUBOOT"

# 护栏：先关看门狗，免得它打断换槽/回滚（见 lib/bootguard）；随后 MCUboot 自己
# 再把它装回来，跳进应用后还开着——应用要是连自己的看门狗都没来得及武装就挂住，
# 这一次超时会把板子复位，让 MCUboot 把没确认的镜像回滚掉。
CONFIG_WATCHDOG=y
CONFIG_BOOT_WATCHDOG_TIMEOUT_MS=30000


# 允许 mcumgr 指定物理槽。必须开：MCUboot 的串口恢复上传默认写的是**主槽**
# （`flash_area_id_from_multi_image_slot(img_num, 0)` 的 0 就是 PRIMARY），
# 也就是直接覆盖正在跑的那一版——没有 A/B、没有 pending、不会回滚。要拿到
# 双分区语义就得让工具能点名"写非活跃槽"，而"哪个是非活跃槽"由升级工具自己
# 查（`image state-read` 里 active 的那个是当前的，另一个就是要写的）。
CONFIG_MCUBOOT_SERIAL_DIRECT_IMAGE_UPLOAD=y

# 让升级工具能写镜像状态（标 pending / 标永久）。没这一项时 smpmgr 的上传会在
# "标记"这一步拿到 ENOTSUP，结果只剩"镜像写进去了、但没有任何试跑/回滚语义"。
CONFIG_BOOT_SERIAL_IMG_GRP_IMAGE_STATE=y

# 没有可启动的镜像时停在串口恢复里，不要空转
CONFIG_BOOT_SERIAL_NO_APPLICATION=y

# 不占用启动路径上的按键：板上那颗按键在应用里已经有语义（开机按住进配置、
# 长按配对），bootloader 再用它会让"开机按住"变得有歧义。
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n

# 复位后留一个短窗口：收到合法 mcumgr 帧就进恢复（"健康设备"升级用）。
# 代价是每次启动多等这么久。
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
# 2 s：应用确认超时/看门狗复位之后，主机还有机会自己进来重刷（不用按键）。
# 代价是每次启动多等 2 s——这条通道值得。
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=2000

# PIN_RESET 先不开：RP2350 上 HAD_RUN 被映射成 RESET_PIN，语义比"按了复位键"宽，
# 有"每次上电都停在恢复模式"的风险
CONFIG_BOOT_SERIAL_PIN_RESET=n

# 应用侧触发入口：标志放在 4 字节 retained RAM（见板级 *_mcuboot.dts）
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_BOOT_SERIAL_BOOT_MODE=y

# 串口恢复期间心跳不要抢占 bootloader 的串口日志
CONFIG_MCUBOOT_LOG_LEVEL_WRN=y
