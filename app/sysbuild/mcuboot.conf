# Applies to the MCUboot image only (sysbuild already propagates the swap mode, not repeated here).

# Serial recovery: the bootloader writes mcumgr frames into a slot itself, over a USB CDC
# (`zephyr,uart-mcumgr` points at the data port CDC): plug in USB and upgrade.
#
# BOOT_SERIAL_UART rather than BOOT_SERIAL_CDC_ACM: the latter needs the old USB stack and
# requires a single `zephyr,cdc-acm-uart` node in the tree while this board has three. The UART
# path can still point at a CDC's UART interface.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y

# The bootloader console lives on cdc_acm_uart3 (disabled by default, the overlay enables it)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# The USB stack is the same subsys/usb as the application; Zephyr's helper only registers the first
CONFIG_ZLRS_USB=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# How bootloader mode introduces itself on USB: the update tool finds the recovery port by it
# (application mode is "ZLRS", defaults in subsys/usb/Kconfig).
CONFIG_ZLRS_USB_MANUFACTURER="zlrs"
CONFIG_ZLRS_USB_PRODUCT="ZLRS MCUBOOT"

# Guard: disarm the watchdog first so it cannot cut a swap or rollback short (subsys/bootguard);
# MCUboot then arms it again and it stays armed across the jump into the application. If the
# application hangs before arming its own, this timeout resets the board and MCUboot rolls back.
CONFIG_WATCHDOG=y
CONFIG_BOOT_WATCHDOG_TIMEOUT_MS=30000


# Let mcumgr name a physical slot. Required: serial recovery uploads go to the PRIMARY slot
# by default (`flash_area_id_from_multi_image_slot(img_num, 0)`), which overwrites the running
# image: no A/B, no pending, no rollback. Real dual-slot semantics need the tool to name the
# inactive slot, and only the update tool can work out which one that is (`image state-read`
# shows which slot is active; the other one is the target).
CONFIG_MCUBOOT_SERIAL_DIRECT_IMAGE_UPLOAD=y

# Let the update tool write image state (pending/permanent). Without it smpmgr's upload fails
# with ENOTSUP at the marking step: the image lands but carries no test/rollback semantics.
CONFIG_BOOT_SERIAL_IMG_GRP_IMAGE_STATE=y

# With no bootable image stay in serial recovery instead of spinning
CONFIG_BOOT_SERIAL_NO_APPLICATION=y

# Do not claim the button at boot: it already means something in the application (config at
# power-on, long press to pair), and reusing it here would make that ambiguous.
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n

# Leave a short window after a reset: a valid mcumgr frame enters recovery (upgrading a
# healthy device). The cost is this delay on every boot.
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
# 2 s: after a confirm timeout or a watchdog reset the host still has a chance to reflash
# without touching the board. Two seconds per boot is worth that channel.
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=2000

# PIN_RESET stays off: on RP2350 HAD_RUN is mapped to RESET_PIN, which is broader than
# "the reset button was pressed" and risks stopping in recovery on every power-up
CONFIG_BOOT_SERIAL_PIN_RESET=n

# The application-side entry: a flag in 4 bytes of retained RAM (see the board dts and the
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_BOOT_SERIAL_BOOT_MODE=y

# Keep the heartbeat from stealing the bootloader's serial log during recovery
CONFIG_MCUBOOT_LOG_LEVEL_WRN=y

# The bootloader checks signatures by reading the slots back. Reading through the XIP cache can
# return a line cached before the swap wrote the slot, which turns a valid image into "signature
# check failed" on the boot right after an upgrade (drivers/flash/flash_rpi_pico.c).
CONFIG_FLASH_RPI_PICO_READ_UNTRANSLATED=y

# This image is the one that reaches BOOTSEL: the ROM bootloader reads UF2 from its USB drive, and
# that is how the bootloader is installed. The application image never does (Kconfig.defconfig of
# the board), so the format is requested here, where the bootloader is configured.
CONFIG_BUILD_OUTPUT_UF2=y
