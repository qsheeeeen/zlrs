# 只作用于 MCUboot 镜像的配置（sysbuild 会把换槽模式自动同步过去，这里不重复设）。

# 串口恢复：bootloader 自己收 mcumgr 帧、把镜像写进 slot。
# 走数据口的 UART1（GP8/GP9，devicetree chosen `zephyr,uart-mcumgr` 指过去），
# 这样 bootloader 里不需要 USB 栈，砖机也能用一根 USB 串口线救回来。
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y

# 允许 mcumgr 指定写哪个槽（1 = slot0、2 = slot1），否则只能写默认槽
CONFIG_MCUBOOT_SERIAL_DIRECT_IMAGE_UPLOAD=y

# 没有可启动的镜像时停在串口恢复里，不要空转
CONFIG_BOOT_SERIAL_NO_APPLICATION=y

# 不占用启动路径上的按键：板上那颗按键在应用里已经有语义（开机按住进配置、
# 长按配对），bootloader 再用它会让"开机按住"变得有歧义。
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n

# 复位后给主机一个短暂的窗口：只要收到一条合法的 mcumgr 帧就进串口恢复。
# 这样"健康设备"也能升级——主机脚本先开始发 `image list`，再让设备复位
# （拔插 USB 或按复位键），窗口里就被接住了。乱码不会触发：boot_serial 要
# 先解析出合法的 SMP 帧头（见 boot/zephyr/main.c 的 boot_serial_check_start）。
# 代价是每次启动多等这个窗口，所以给 300 ms，够脚本接住又不至于太慢。
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=300

# PIN_RESET 入口先不开：RP2350 上 hwinfo 把 POWMAN 的 HAD_RUN 位映射成
# RESET_PIN，而这一位在复位来源上的语义比"按了复位键"宽，上板确认之前开它
# 有"每次上电都停在恢复模式"的风险。
CONFIG_BOOT_SERIAL_PIN_RESET=n

# 应用侧触发的入口：应用把 boot mode 置成 BOOTLOADER 后重启，bootloader 在
# 这里读到标志就停在串口恢复（分区表旁边的那块 4 字节 retained RAM，
# 见 boards/zlrs/rp2350_zero_core2021/*_mcuboot.dts 引入的 RP2350 覆盖）。
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_BOOT_SERIAL_BOOT_MODE=y

# 串口恢复期间心跳不要抢占 bootloader 的串口日志
CONFIG_MCUBOOT_LOG_LEVEL_WRN=y
