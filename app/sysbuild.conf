# sysbuild 配置：`west build --sysbuild` 时生效（直接把 bootloader 一起编出来）。
# 不带 mcuboot 的板级变体（.../m33/hf、.../m33/lf）用普通 `west build`，不经过这里。
#
# 用法（两个 sub-G SKU 各一个带 bootloader 的目标）：
#   west build --sysbuild -b rp2350_zero_core2021/rp2350a/m33/hf/mcuboot app
#   west build --sysbuild -b rp2350_zero_core2021/rp2350a/m33/lf/mcuboot app

# 构建 MCUboot，并把它的运行模式同步给应用与 bootloader
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# 换槽方式：swap using move——同样不需要 scratch 分区，但是 MCUboot 最保守、
# 用得最多的那条路。原来用的 swap using offset 在这块板上"进得去、回不来"：
# 未确认的 test 镜像复位后还是它自己，回滚不生效。见 doc/08-firmware.md 第 6 节
# 与板级 README 的分区表。
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y

# 镜像签名：ECDSA-P256。sysbuild 会把类型与密钥同时同步给 bootloader（校验用）
# 与应用（签名用），不会出现两边不一致。开发期沿用 MCUboot 自带的测试密钥
# （默认值就是 mcuboot 仓库里的 root-ec-p256.pem）。
#
# **量产前必须换成自己的密钥**：
#   python bootloader/mcuboot/scripts/imgtool.py genkey -k zlrs-prod.pem -t ecdsa-p256
# 然后加一行 SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="<私钥路径>"（私钥不要提交），
# 并重新烧一次 bootloader——公钥烧在 bootloader 里，换了钥匙就得重烧它。
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
