#
# sysbuild settings, read by `west build --sysbuild`, which is how every image is built: the
# bootloader is part of the target (there is no bootloader-less variant to skip this).
#
# Usage (one bootloader target per sub-G SKU):
#   west build --sysbuild -b rp2350_zero_core2021/rp2350a/m33_0/hf app
#   west build --sysbuild -b rp2350_zero_core2021/rp2350a/m33_0/lf app

# Build MCUboot and propagate its operating mode to both images
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Swap using move needs no scratch partition. The shared flash layout is in
# boards/zlrs/rp2350_zero_core2021/rp2350_zero_core2021_partitions.dtsi.
# See doc/06-firmware.md for installation and rollback behavior.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y

# Image signing: ECDSA-P256. sysbuild hands the type and key to the bootloader (verify) and
# the application (sign) together, so they cannot drift apart. Development keeps MCUboot's
# bundled test key (the default is root-ec-p256.pem from the mcuboot tree).
#
# **Replace this with your own key before production**:
#   python bootloader/mcuboot/scripts/imgtool.py genkey -k zlrs-prod.pem -t ecdsa-p256
# then add SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="<private key path>" (never commit the key)
# and reflash the bootloader: the public key lives inside it, so a new key means a reflash.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
