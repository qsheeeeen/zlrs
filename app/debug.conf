#
# Extra configuration for development builds:
#   west build -b "$ZLRS_BOARD" "$ZLRS_APP" \
#     -- -DEXTRA_CONF_FILE="$ZLRS_REPO_ROOT/app/debug.conf" \
#        -DDTC_OVERLAY_FILE="$ZLRS_REPO_ROOT/app/debug.overlay"
#
# Enables the console CDC (cdc_acm_uart3) plus shell and immediate logging. Production
# images have none of this (doc/12-debug.md); prj.conf already covers LOG, THREAD_NAME...

# This is a development image: it may use the ZLRS_APP_DEBUG_* options, and nothing that
# needs them may appear in a shipped configuration (tools/gates.sh checks that).
CONFIG_ZLRS_APP_DEBUG=y

CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_ASSERT=y

# Console: kernel log + shell on the cdc_acm_uart3 the debug overlay enables
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_ZLRS_APP_DEBUG_SHELL=y

# Guard rail for troubleshooting
CONFIG_ZLRS_APP_WATCHDOG=y
