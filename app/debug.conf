#
# Extra configuration for development builds:
#   west build --sysbuild -b "$ZLRS_BOARD" "$ZLRS_APP" \
#     -- -DEXTRA_CONF_FILE="$ZLRS_REPO_ROOT/app/debug.conf" \
#        -DDTC_OVERLAY_FILE="$ZLRS_REPO_ROOT/app/debug.overlay"
#
# Enables the console CDC (cdc_acm_uart2) plus shell and deferred logging. Production
# images have none of this (doc/11-debug.md); prj.conf already covers LOG, THREAD_NAME...

# This is a development image: it may use the ZLRS_APP_DEBUG_* options, and nothing that
# needs them may appear in a shipped configuration (checked by CI).
CONFIG_ZLRS_APP_DEBUG=y

# Logs remain in RAM while RF runs and flush at boot or during management mode. This avoids
# flash writes masking timer IRQs. The fault itself is also covered by the coredump.
CONFIG_ASSERT=y

# Command console on the cdc_acm_uart2 the debug overlay enables
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_ZLRS_APP_DEBUG_SHELL=y
# Logs are exported through management from flash. An unopened console must not block boot
# or leave the shell thread waiting behind log output when a terminal later connects.
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_LOG_BACKEND_UART=n
# Polling TX keeps command replies independent of the shell backend's IRQ TX state.
CONFIG_SHELL_BACKEND_SERIAL_FORCE_TX_BLOCKING_MODE=y

# Keep the development image's status pixel dim while it runs on the bench.
CONFIG_ZLRS_APP_DEBUG_LED_BRIGHTNESS_PERCENT=10

# Bench: browse the log partition over the console (ls/cat on /lfs)
CONFIG_FILE_SYSTEM_SHELL=y
