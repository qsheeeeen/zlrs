#
# Extra configuration for development builds:
#   west build -b "$ZLRS_BOARD" "$ZLRS_APP" \
#     -- -DEXTRA_CONF_FILE="$ZLRS_REPO_ROOT/app/debug.conf" \
#        -DDTC_OVERLAY_FILE="$ZLRS_REPO_ROOT/app/debug.overlay"
#
# 打开 console CDC（cdc_acm_uart3）+ shell，以及只该出现在调试构建里的临时入口
# （数据口魔数）。量产固件没有这些（doc/12-debug.md）。

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y

# 控制台：kernel log + shell（对应 debug.overlay 打开的 cdc_acm_uart3）
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_ZLRS_APP_SHELL=y

# 调试构建也保留"进恢复"入口（正式入口在配置协议里）
CONFIG_ZLRS_APP_UPDATE_TRIGGER=y

# 排障用的护栏
CONFIG_ZLRS_APP_WATCHDOG=y
