# Core2021 还没接的时候用它：射频整块不参与（走 app/src/radio_null.c），
# 其余（USB、配置口、状态灯、CRSF、熵源、NVS）都是正常配置。
#
#   west build -b "$ZLRS_BOARD" "$ZLRS_APP" -- \
#     -DEXTRA_CONF_FILE="$ZLRS_REPO_ROOT/app/debug.conf;$ZLRS_REPO_ROOT/app/bringup-noradio.conf" \
#     -DDTC_OVERLAY_FILE="$ZLRS_REPO_ROOT/app/debug.overlay"
#
# 注意：射频打开而模块没接时，vendored 的 lr20xx HAL 会在等 BUSY 的死循环里
# 忙等（默认超时 600 s，且超时后 k_oops），整机会黑灯且 USB 不枚举——
# 那是驱动的事，测射频之外的功能一律用这份配置。
CONFIG_ZLRS_APP_RADIO=n
