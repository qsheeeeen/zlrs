#
# Use this while no Core2021 is attached: the radio sits out entirely (app/src/radio_null.c)
# and everything else (USB, config port, status LED, CRSF, entropy, NVS) is normal.
#
#   west build -b "$ZLRS_BOARD" "$ZLRS_APP" -- \
#     -DEXTRA_CONF_FILE="$ZLRS_REPO_ROOT/app/debug.conf;$ZLRS_REPO_ROOT/app/bringup-noradio.conf" \
#     -DDTC_OVERLAY_FILE="$ZLRS_REPO_ROOT/app/debug.overlay"
#
# Note: with the radio enabled and no module attached, the vendored lr20xx HAL spins
# waiting for BUSY (600 s default, then k_oops), leaving the board dark and USB dead —
# that is the driver's doing. Use this config for anything that does not test the radio.
CONFIG_ZLRS_APP_RADIO=n
