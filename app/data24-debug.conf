# Bench isolation: only the 2.4 GHz data link uses the radio.
# Combine with app/debug.conf and app/debug.overlay on either LF or HF hardware.
# Pairing must already exist in NVS: the current pairing workflow needs the control link.
CONFIG_ZLRS_APP_LINK_CONTROL=n
CONFIG_ZLRS_APP_LINK_DATA=y
CONFIG_ZLRS_APP_BAND_ROLE_SUBG_CONTROL=y
CONFIG_ZLRS_APP_SUB_BAND_MIX=n
# Keep the data channel fixed while diagnosing slot timing. Authentication, the
# session handshake and ARQ remain enabled.
CONFIG_ZLRS_APP_FHSS=n
