# SPDX-License-Identifier: Apache-2.0

CONFIG_ZTEST=y
CONFIG_TEST_HW_STACK_PROTECTION=n
CONFIG_TEST_LOGGING_DEFAULTS=n
CONFIG_ZTEST_STACK_SIZE=3072
CONFIG_ZTEST_NO_YIELD=n
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BOOT_BANNER=n
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_PM_DEVICE=y
CONFIG_ASSERT=y
CONFIG_SPEED_OPTIMIZATIONS=y
# RP2350 USB DPRAM faults on the toolchain memcpy halfword stores.
CONFIG_MINIMAL_LIBC=y
CONFIG_MINIMAL_LIBC_OPTIMIZE_STRING_FOR_SIZE=y
CONFIG_MINIMAL_LIBC_LL_PRINTF=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_CODE_DATA_RELOCATION=y
CONFIG_CRYPTO=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_REBOOT=y
CONFIG_WATCHDOG=y

# caps.h requires the same storage capability as the application. No test accesses NVS.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y

CONFIG_ZLRS_USB=y
CONFIG_ZLRS_USB_PRODUCT="ZLRS CRYPTO TEST"
CONFIG_HWINFO=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_CDC_ACM_BUF_POOL=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_UDC_RPI_PICO_STACK_SIZE=2048
CONFIG_USBD_THREAD_STACK_SIZE=2048
