# Isolate the fixed-channel DATA link for RF throughput and raw-radio tests.
# Pairing, P1 authentication, the session handshake and ARQ remain enabled.
CONFIG_ZLRS_APP_FHSS=n
# Keep the measured preparation window local to test firmware.
CONFIG_ZLRS_APP_DATA_24_PREPARE_US=1000

# Leave this image unconfirmed. The runner restores the previous firmware after testing.
CONFIG_ZLRS_APP_MCUBOOT_CONFIRM_TIMEOUT_MS=120000
