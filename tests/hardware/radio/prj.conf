# SPDX-License-Identifier: Apache-2.0
# Isolate the fixed-channel DATA link for RF throughput and raw-radio tests.
# Pairing, P1 authentication, the session handshake and ARQ remain enabled.
CONFIG_ZLRS_APP_FHSS=n
# Leave this image unconfirmed. The runner restores the previous firmware after testing.
# Leave room for the peer's USB upgrade and three bounded DATA rounds.
CONFIG_ZLRS_APP_MCUBOOT_CONFIRM_TIMEOUT_MS=300000

# Test-only structured control over Zephyr MCUmgr serial; no interactive shell.
CONFIG_CONSOLE=y
CONFIG_UART_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_THREAD_PRIO=3
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=3072
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=8192
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=2
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
