description: ZLRS CRSF UART electrical configuration
compatible: "zlrs,crsf-port"
include: base.yaml
properties:
  release-timer:
    type: phandle
    required: true
    description: Dedicated microsecond counter for UART line release
  tx-gpios:
    type: phandle-array
    required: true
    description: UART TX pad released to high impedance in handset mode
  handset-baud:
    type: int
    required: true
  fc-baud:
    type: int
    required: true
