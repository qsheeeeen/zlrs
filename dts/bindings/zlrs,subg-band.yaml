description: |
  本机 sub-G 硬件（Core2021 的 SKU）：0 = LF（470/433），1 = HF（868/915）。
  地区必须与它匹配（LF 板跑不了 915），见 lib/region 的 zlrs_region_validate()。

compatible: "zlrs,subg-band"

properties:
  band:
    type: int
    required: true
    description: 0 = LF（470 / 433），1 = HF（868 / 915）
    enum: [0, 1]
