description: |
  Local sub-G hardware (the Core2021 SKU): 0 = LF (470/433), 1 = HF (868/915).
  The region has to match it (an LF board cannot do 915), see zlrs_region_validate() in lib/region.

compatible: "zlrs,subg-band"

properties:
  band:
    type: int
    required: true
    description: 0 = LF (470 / 433), 1 = HF (868 / 915)
    enum: [0, 1]
