#
# 每次 push / PR 都跑的快速检查：纯 C 层的单元与仿真测试，外加配置工具的组帧
# 自检。不需要 Zephyr 工作区，几十秒出结果。
#
# 固件构建（要拉 ~5 GB 工作区、~10 分钟）单独放在 firmware.yml，见那里的说明。

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: toolchain info
        run: |
          cc --version | head -1
          make --version | head -1
          python3 --version
      - name: host tests
        run: make -C tests/host run
      - name: config tool self-test
        run: python3 scripts/zlrs-config.py --self-test
