#
# The quick check on every push and PR: unit and simulation tests for the pure C layers plus the
# config tool's framing self-test. No Zephyr workspace needed; results in under a minute.
#
# Firmware builds (~5 GB workspace, ~10 minutes) live in firmware.yml; see the notes there.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: toolchain info
        run: |
          cc --version | head -1
          make --version | head -1
          python3 --version
      # Host tests carry ASan + UBSan by default; CI also turns on leak detection (restricted
      # containers without ptrace cannot start it, so it stays off locally).
      - name: host tests (ASan + UBSan)
        run: make -C tests/host run LEAKS=1
      - name: config tool self-test
        run: python3 scripts/zlrs-config.py --self-test
      - name: recovery trigger self-test
        run: python3 scripts/zlrs-recovery.py --self-test
      - name: update script self-test
        run: python3 scripts/zlrs-update.py --self-test
      - name: bring-up check self-test
        run: python3 scripts/zlrs-bringup.py --self-test
