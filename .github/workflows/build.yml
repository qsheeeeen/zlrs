#
# The quick check on every push and PR: unit and simulation tests for the pure C layers plus the
# device tools' unit tests. No Zephyr workspace needed; results in under a minute.
#
# Firmware builds (~5 GB workspace, ~10 minutes) live in firmware.yml; see the notes there.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: tree gates
        run: tests/gates.sh

  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: toolchain info
        run: |
          cc --version | head -1
          make --version | head -1
          python3 --version
      # Host tests carry ASan + UBSan by default; CI also turns on leak detection (restricted
      # containers without ptrace cannot start it, so it stays off locally).
      - name: host tests (ASan + UBSan)
        run: make -C tests/host run LEAKS=1
      - name: device tool tests
        run: python3 tests/tools/run.py
