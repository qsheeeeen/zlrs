#
# The quick check on every push and PR: unit and simulation tests for the pure C layers plus the
# device tools' unit tests. No Zephyr workspace needed; results in under a minute.
#
# Firmware builds (~5 GB workspace, ~10 minutes) live in firmware.yml; see the notes there.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: tree gates
        run: tests/gates.sh

  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: toolchain info
        run: |
          cc --version | head -1
          cmake --version | head -1
          python3 --version
      - name: configure host tests
        run: cmake -S tests/host -B build/host -DZLRS_HOST_LEAKS=ON
      - name: build host tests
        run: cmake --build build/host --parallel
      - name: host tests (ASan + UBSan + LSan)
        run: ctest --test-dir build/host --output-on-failure
      - name: device tool tests
        run: python3 tests/tools/run.py
