#
# Python tools and Zephyr native tests run on every push and PR.
# Signed hardware images are built separately in firmware.yml.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: host tool dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: tools and architecture
        run: |
          bash tests/gates.sh
          python tests/tools/run.py

  simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: zlrs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build device-tree-compiler
      - name: Zephyr workspace and test dependencies
        run: |
          zlrs/tools/setup-zephyr.sh "$GITHUB_WORKSPACE"
          .venv/bin/python -m pip install -r zlrs/tests/app/requirements.txt
      - name: complete native simulation matrix
        run: |
          source zlrs/tools/zephyr-env.sh
          export ZEPHYR_TOOLCHAIN_VARIANT=host
          unset ZEPHYR_SDK_INSTALL_DIR
          python "$ZEPHYR_BASE/scripts/twister" \
            -T zlrs/tests/app -p native_sim/native/64 --exclude-tag benchmark \
            --outdir build/simulation --jobs 2 --inline-logs
      - name: native performance measurements
        run: |
          source zlrs/tools/zephyr-env.sh
          export ZEPHYR_TOOLCHAIN_VARIANT=host
          unset ZEPHYR_SDK_INSTALL_DIR
          python "$ZEPHYR_BASE/scripts/twister" \
            -T zlrs/tests/app/link/bench -p native_sim/native/64 \
            --outdir build/bench --inline-logs
      - name: upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: |
            build/simulation/*.xml
            build/simulation/*.json
            build/simulation/*.log
            build/simulation/**/handler.log
            build/simulation/**/handler_stderr.log
            build/simulation/**/build.log
            build/bench/*.xml
            build/bench/**/*.log
