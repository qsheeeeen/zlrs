#
# Firmware build: install the west workspace (~5 GB) and the Zephyr SDK the way the README
# describes, then build both sub-G SKUs. It takes about 10 minutes, so it stays separate
# from the fast host tests and never blocks a push on its own.
#
# Marked continue-on-error: the build could not be validated on a runner yet, so let it report
# without blocking; drop the line once it runs green and make it a hard gate.

name: firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: zlrs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: runner info
        run: |
          cmake --version | head -1
          df -h / | tail -1
          free -m | head -2

      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build device-tree-compiler

      # Build the workspace with the repository's own script: CI also validates the README flow
      - name: workspace (venv + west init/update + requirements)
        run: |
          set -x
          zlrs/tools/setup-zephyr.sh "$GITHUB_WORKSPACE"
          df -h / | tail -1

      - name: zephyr sdk (minimal + arm toolchain)
        run: |
          set -x
          cd "$HOME"
          curl -fsSLO https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.0/zephyr-sdk-1.0.0_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-1.0.0_linux-x86_64_minimal.tar.xz
          cd zephyr-sdk-1.0.0
          ./setup.sh -t arm-zephyr-eabi -h -c

      - name: build (hf sku)
        run: |
          set -x
          . zlrs/tools/zephyr-env.sh
          zlrs-build

      - name: build (lf sku)
        run: |
          set -x
          . zlrs/tools/zephyr-env.sh
          ZLRS_BOARD=rp2350_zero_core2021/rp2350a/m33/lf zlrs-build -d build-lf

      # Debug image: the overlay is the only place that sets CONFIG_ZLRS_APP_DEBUG, so this step
      # is what keeps the debug-only options (shell, stats log, boot delay) compiling.
      - name: build (debug overlay, hf sku)
        run: |
          set -x
          . zlrs/tools/zephyr-env.sh
          zlrs-build -d build-debug -- \
            -DEXTRA_CONF_FILE="$ZLRS_REPO_ROOT/app/debug.conf" \
            -DDTC_OVERLAY_FILE="$ZLRS_REPO_ROOT/app/debug.overlay"

      # Bench profile: turn every complex feature off so the trimmed combination still compiles
      - name: build (bring-up toggles off, both skus)
        run: |
          set -x
          . zlrs/tools/zephyr-env.sh
          for board in rp2350_zero_core2021/rp2350a/m33/hf rp2350_zero_core2021/rp2350a/m33/lf; do
            ZLRS_BOARD="$board" zlrs-build -d "build-bringup-${board##*/}" -- \
              -DCONFIG_ZLRS_APP_SECURITY_PROFILE_P0=y \
              -DCONFIG_ZLRS_APP_SECURITY_PROFILE_P1=n \
              -DCONFIG_ZLRS_APP_FHSS=n \
              -DCONFIG_ZLRS_APP_SESSION_HANDSHAKE=n \
              -DCONFIG_ZLRS_APP_TELEMETRY=n \
              -DCONFIG_ZLRS_APP_RESYNC_PERIOD_MS=0
          done

      # Radio off (CONFIG_ZLRS_APP_RADIO=n): the profile for a board without a Core2021 attached,
      # running ports, config mode, button, LED and NVS only, through app/src/radio_null.c.
      - name: build (radio off, both skus)
        run: |
          set -x
          . zlrs/tools/zephyr-env.sh
          for board in rp2350_zero_core2021/rp2350a/m33/hf rp2350_zero_core2021/rp2350a/m33/lf; do
            ZLRS_BOARD="$board" zlrs-build -d "build-noradio-${board##*/}" -- \
              -DCONFIG_ZLRS_APP_RADIO=n
          done

      # Single-link cut: the data link alone (control link, CRSF port, config mode, button and LED
      # all off). The config-protocol and LED libraries are not pinned with CONFIG_ZLRS_*=n but
      # follow their application switches, so this profile also proves the switches really cut them.
      - name: build (data link only, both skus)
        run: |
          set -x
          . zlrs/tools/zephyr-env.sh
          for board in rp2350_zero_core2021/rp2350a/m33/hf rp2350_zero_core2021/rp2350a/m33/lf; do
            ZLRS_BOARD="$board" zlrs-build -d "build-dataonly-${board##*/}" -- \
              -DCONFIG_ZLRS_APP_LINK_CONTROL=n \
              -DCONFIG_ZLRS_APP_CRSF_PORT=n \
              -DCONFIG_ZLRS_APP_CONFIG_MODE=n \
              -DCONFIG_ZLRS_APP_PAIRING_BUTTON=n \
              -DCONFIG_ZLRS_APP_STATUS_LED=n
          done

      # LoRa long-range control link: radio_params.lora on the device side can only be compile-checked
      - name: build (lora control link, both skus)
        run: |
          set -x
          . zlrs/tools/zephyr-env.sh
          for board in rp2350_zero_core2021/rp2350a/m33/hf rp2350_zero_core2021/rp2350a/m33/lf; do
            ZLRS_BOARD="$board" zlrs-build -d "build-lora-${board##*/}" -- \
              -DCONFIG_ZLRS_APP_CONTROL_MODULATION_LORA=y \
              -DCONFIG_ZLRS_APP_CONTROL_MODULATION_FLRC=n
          done

      # Racing mode: control owns 2.4G and the data link moves to sub-G
      - name: build (racing band role, both skus)
        run: |
          set -x
          . zlrs/tools/zephyr-env.sh
          for board in rp2350_zero_core2021/rp2350a/m33/hf rp2350_zero_core2021/rp2350a/m33/lf; do
            ZLRS_BOARD="$board" zlrs-build -d "build-racing-${board##*/}" -- \
              -DCONFIG_ZLRS_APP_BAND_ROLE_SUBG_DATA=y \
              -DCONFIG_ZLRS_APP_BAND_ROLE_SUBG_CONTROL=n
          done

      # MCUboot: sysbuild builds the bootloader together with the signed application for both SKUs,
      # and also exercises the script that wraps a signed image into a UF2 for the first flash
      - name: build (mcuboot, both skus)
        run: |
          set -x
          . zlrs/tools/zephyr-env.sh
          for board in rp2350_zero_core2021/rp2350a/m33/hf rp2350_zero_core2021/rp2350a/m33/lf; do
            sku="${board##*/}"
            west build --sysbuild -b "${board}/mcuboot" zlrs/app -d "build-${sku}-mcuboot"
            python3 zlrs/tools/make-signed-uf2.py "build-${sku}-mcuboot"
          done

      - name: upload uf2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rp2350_zero_core2021-uf2
          path: |
            build/zephyr/zephyr.uf2
            build-lf/zephyr/zephyr.uf2
            build-hf-mcuboot/mcuboot/zephyr/zephyr.uf2
            build-hf-mcuboot/app/zephyr/zephyr.signed.uf2
            build-lf-mcuboot/mcuboot/zephyr/zephyr.uf2
            build-lf-mcuboot/app/zephyr/zephyr.signed.uf2
          if-no-files-found: ignore
