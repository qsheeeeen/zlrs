#
# Firmware build: install the west workspace (~5 GB) and the Zephyr SDK the way the README
# describes, then build both sub-G SKUs. It takes about 10 minutes, so it stays separate
# from the fast host tests and never blocks a push on its own.
#
# Marked continue-on-error: the build could not be validated on a runner yet, so let it report
# without blocking; drop the line once it runs green and make it a hard gate.

name: firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: zlrs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: runner info
        run: |
          cmake --version | head -1
          df -h / | tail -1
          free -m | head -2

      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build device-tree-compiler

      # Build the workspace with the repository's own script: CI also validates the README flow
      - name: workspace (venv + west init/update + requirements)
        run: |
          set -x
          zlrs/tools/setup-zephyr.sh "$GITHUB_WORKSPACE"
          df -h / | tail -1

      - name: zephyr sdk (minimal + arm toolchain)
        run: |
          set -x
          cd "$HOME"
          curl -fsSLO https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.0/zephyr-sdk-1.0.0_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-1.0.0_linux-x86_64_minimal.tar.xz
          cd zephyr-sdk-1.0.0
          ./setup.sh -t arm-zephyr-eabi -h -c

      - name: build (hf sku)
        run: |
          set -x
          . zlrs/tools/zephyr-env.sh
          zlrs-build

      - name: build (lf sku)
        run: |
          set -x
          . zlrs/tools/zephyr-env.sh
          ZLRS_BOARD=rp2350_zero_core2021/rp2350a/m33/lf zlrs-build -d build-lf

      # Debug image: the overlay is the only place that sets CONFIG_ZLRS_APP_DEBUG, so this step
      # is what keeps the debug-only options (shell, stats log, boot delay) compiling.
      - name: build (debug overlay, hf sku)
        run: |
          set -x
          . zlrs/tools/zephyr-env.sh
          zlrs-build -d build-debug -- \
            -DEXTRA_CONF_FILE="$ZLRS_REPO_ROOT/app/debug.conf" \
            -DDTC_OVERLAY_FILE="$ZLRS_REPO_ROOT/app/debug.overlay"

      # Single-link cut: the data link alone (control link, CRSF port, config mode, button and LED
      # all off).
      # One switch is enough: the CRSF port belongs to the control link, and config mode, button
      # and LED follow devicetree (app/src/platform/caps.h), so cutting the control link takes
      # the CRSF port with it and the rest stays available on a board that has the hardware.
      - name: build (data link only, both skus)
        run: |
          set -x
          . zlrs/tools/zephyr-env.sh
          for board in rp2350_zero_core2021/rp2350a/m33/hf rp2350_zero_core2021/rp2350a/m33/lf; do
            sku="${board##*/}"
            ZLRS_BOARD="$board" zlrs-build -d "build-dataonly-${sku}" -- \
              -DCONFIG_ZLRS_APP_LINK_CONTROL=n
          done

      # LoRa long-range control link: radio_params.lora on the device side can only be compile-checked
      - name: build (lora control link, both skus)
        run: |
          set -x
          . zlrs/tools/zephyr-env.sh
          for board in rp2350_zero_core2021/rp2350a/m33/hf rp2350_zero_core2021/rp2350a/m33/lf; do
            sku="${board##*/}"
            ZLRS_BOARD="$board" zlrs-build -d "build-lora-${sku}" -- \
              -DCONFIG_ZLRS_APP_CONTROL_MODULATION_LORA=y \
              -DCONFIG_ZLRS_APP_CONTROL_MODULATION_FLRC=n
          done

      # Racing mode: control owns 2.4G and the data link moves to sub-G
      - name: build (racing band role, both skus)
        run: |
          set -x
          . zlrs/tools/zephyr-env.sh
          for board in rp2350_zero_core2021/rp2350a/m33/hf rp2350_zero_core2021/rp2350a/m33/lf; do
            sku="${board##*/}"
            ZLRS_BOARD="$board" zlrs-build -d "build-racing-${sku}" -- \
              -DCONFIG_ZLRS_APP_BAND_ROLE_SUBG_DATA=y \
              -DCONFIG_ZLRS_APP_BAND_ROLE_SUBG_CONTROL=n
          done

      # Every board target is a bootloader target (there is no bare variant), so the signed image
      # and the bootloader are always built together. The application is installed and updated
      # through the bootloader (serial recovery), never dragged on as a UF2.
      - name: build (signed images for both skus)
        run: |
          set -x
          . zlrs/tools/zephyr-env.sh
          for board in rp2350_zero_core2021/rp2350a/m33/hf rp2350_zero_core2021/rp2350a/m33/lf; do
            sku="${board##*/}"
            ZLRS_BOARD="$board" zlrs-build -d "build-${sku}"
            # BOOTSEL carries the bootloader image only
            test -e "build-${sku}/mcuboot/zephyr/zephyr.uf2"
            test ! -e "build-${sku}/app/zephyr/zephyr.uf2"
          done

      - name: upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rp2350_zero_core2021-images
          path: |
            build-hf/mcuboot/zephyr/zephyr.uf2
            build-lf/mcuboot/zephyr/zephyr.uf2
            build-hf/app/zephyr/zephyr.signed.bin
            build-lf/app/zephyr/zephyr.signed.bin
          if-no-files-found: ignore
