#
# 固件构建：按 README 的流程把 west 工作区（~5 GB）和 Zephyr SDK 装起来，
# 再把 hf / lf 两个 sub-G SKU 各构建一次。约 10 分钟，所以跟快速的
# host-tests 分开，失败时也不拖累每次 push 的状态。
#
# 现在标了 continue-on-error：构建还在这台机器上验证不了，先让它报错但不拦
# 提交；跑绿之后去掉这一行，变成硬门禁。

name: firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: zlrs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: runner info
        run: |
          cmake --version | head -1
          df -h / | tail -1
          free -m | head -2

      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build device-tree-compiler

      # 直接用仓库里的脚本搭工作区：CI 顺带验证 README 里写的那条流程
      - name: workspace (venv + west init/update + requirements)
        run: |
          set -x
          zlrs/scripts/setup-zephyr.sh "$GITHUB_WORKSPACE"
          df -h / | tail -1

      - name: zephyr sdk (minimal + arm toolchain)
        run: |
          set -x
          cd "$HOME"
          curl -fsSLO https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.0/zephyr-sdk-1.0.0_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-1.0.0_linux-x86_64_minimal.tar.xz
          cd zephyr-sdk-1.0.0
          ./setup.sh -t arm-zephyr-eabi -h -c

      - name: build (hf sku)
        run: |
          set -x
          . zlrs/scripts/zephyr-env.sh
          zlrs-build

      - name: build (lf sku)
        run: |
          set -x
          . zlrs/scripts/zephyr-env.sh
          ZLRS_BOARD=rp2350_zero_core2021/rp2350a/m33/lf zlrs-build -d build-lf

      # 上板调试档：把所有复杂功能都关掉，验证裁剪组合也编得过（见 01 第 2.3 节）
      - name: build (bring-up toggles off, both skus)
        run: |
          set -x
          . zlrs/scripts/zephyr-env.sh
          for board in rp2350_zero_core2021/rp2350a/m33/hf rp2350_zero_core2021/rp2350a/m33/lf; do
            ZLRS_BOARD="$board" zlrs-build -d "build-bringup-${board##*/}" -- \
              -DCONFIG_ZLRS_APP_SECURITY_PROFILE_P0=y \
              -DCONFIG_ZLRS_APP_SECURITY_PROFILE_P1=n \
              -DCONFIG_ZLRS_APP_FHSS=n \
              -DCONFIG_ZLRS_APP_SESSION_HANDSHAKE=n \
              -DCONFIG_ZLRS_APP_TELEMETRY=n
          done

      - name: upload uf2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rp2350_zero_core2021-uf2
          path: |
            build/zephyr/zephyr.uf2
            build-lf/zephyr/zephyr.uf2
          if-no-files-found: ignore
